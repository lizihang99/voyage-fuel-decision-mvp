[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "voyage-fuel"
version = "0.1.0"
description = "Single-voyage FuelEU and EU ETS fuel decision calculator"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "playwright>=1.55,<2",
  "pypdf>=5,<6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
voyage-fuel-web = "voyage_fuel.web:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voyage_fuel = ["data/*.csv", "templates/*.html", "static/*"]
