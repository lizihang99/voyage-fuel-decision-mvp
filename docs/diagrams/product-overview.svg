<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655" role="img" aria-labelledby="title description">
<title id="title">产品全景</title>
<desc id="description">业务问题、案例输入、计算、比较、三类建议和结果交付。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#84919B"/>
  </marker>
</defs>
<rect width="1000" height="655" fill="#F4F6F7"/>
<text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2933"><tspan x="40" y="48">产品全景</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="40" y="84">同一航段换用燃料：多花多少钱、改善多少、哪些条件仍需确认？</tspan></text><g data-card="业务问题"><rect x="40" y="125" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="125" width="280" height="5" rx="2" fill="#956524"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="180.0" y="164">业务问题</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="180.0" y="202">继续使用基准燃料（B0），</tspan><tspan x="180.0" y="229">还是换用或混兑候选燃料？</tspan></text></g><g data-card="建立航次案例"><rect x="360" y="125" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="360" y="125" width="280" height="5" rx="2" fill="#3E6F98"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="500.0" y="164">建立航次案例</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="500.0" y="202">年份 · 两个相邻有效挂靠港</tspan><tspan x="500.0" y="229">基准燃料 · 候选报价</tspan><tspan x="500.0" y="256">价格 · 币种 · 限制条件</tspan></text></g><g data-card="同一能源需求下计算"><rect x="680" y="125" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="680" y="125" width="280" height="5" rx="2" fill="#4E7B63"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="820.0" y="164">同一能源需求下计算</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="820.0" y="202">燃料用量 · 排放</tspan><tspan x="820.0" y="229">EU ETS 配额成本</tspan><tspan x="820.0" y="256">FuelEU 强度与合规余额</tspan></text></g><g data-card="方案比较"><rect x="680" y="355" width="280" height="165" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="680" y="355" width="280" height="5" rx="2" fill="#7A5F8E"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="820.0" y="394">方案比较</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="820.0" y="432">各候选分别与基准比较</tspan><tspan x="820.0" y="459">成本变化 · 合规改善</tspan><tspan x="820.0" y="486">预算 · 供应 · 混兑比例限制</tspan></text></g><g data-card="按目标给出建议"><rect x="360" y="355" width="280" height="165" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="360" y="355" width="280" height="5" rx="2" fill="#956524"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="500.0" y="394">按目标给出建议</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="500.0" y="432">模型成本最低</tspan><tspan x="500.0" y="459">达到参考线的最低成本</tspan><tspan x="500.0" y="486">报告方案内最大合规改善</tspan></text></g><g data-card="复核与交付"><rect x="40" y="355" width="280" height="165" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="355" width="280" height="5" rx="2" fill="#347C7B"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="180.0" y="394">复核与交付</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="180.0" y="432">工作台查看结论与依据</tspan><tspan x="180.0" y="459">CSV / PDF 导出</tspan><tspan x="180.0" y="486">共享同一次计算结果</tspan></text></g><path data-connector="flow" d="M 320 205 H 360" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 640 205 H 680" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 820 285 V 355" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 680 437 H 640" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 360 437 H 320" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#52616C"><tspan x="500" y="565">参考线指 FuelEU 温室气体强度（GHGI）目标，不代表年度合规已完成。</tspan></text><path d="M 40 590 H 960" stroke="#D4DADF"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#52616C"><tspan x="500" y="624">航次级估算 · FuelEU 金额单列参考 · 认证、兼容性、供应与交付待确认</tspan></text>
</svg>
