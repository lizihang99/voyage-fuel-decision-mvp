<rect width="1200" height="760" fill="#F4F6F7"/>
<text x="56" y="50" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2933"><tspan x="56" y="50">产品全景</tspan></text><text x="56" y="84" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="56" y="84">从一条航段的燃料问题，到可比较、可复核的航次级决策结果</tspan></text><rect x="60" y="135" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="60" y="135" width="340" height="5" rx="2.5" fill="#B47B32"/><text x="230.0" y="174.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="230.0" y="174.0">业务问题</tspan></text><text x="230.0" y="228.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="230.0" y="228.9">这条航段继续使用 B0，</tspan><tspan x="230.0" y="251.9">还是加入候选燃料或混兑方案？</tspan></text><rect x="430" y="135" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="430" y="135" width="340" height="5" rx="2.5" fill="#3E6F98"/><text x="600.0" y="174.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="600.0" y="174.0">航次决策案例</tspan></text><text x="600.0" y="217.4" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="600.0" y="217.4">报告年份 · 两个相邻有效 Port of Call</tspan><tspan x="600.0" y="240.4">基准燃料 · 候选燃料</tspan><tspan x="600.0" y="263.4">价格 · 币种 · 约束</tspan></text><rect x="800" y="135" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="800" y="135" width="340" height="5" rx="2.5" fill="#4E7B63"/><text x="970.0" y="174.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="970.0" y="174.0">统一计算</tspan></text><text x="970.0" y="217.4" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="970.0" y="217.4">港口范围 + 燃料因子</tspan><tspan x="970.0" y="240.4">能源 · 排放 · EU ETS · FuelEU</tspan><tspan x="970.0" y="263.4">成本 · 约束</tspan></text><rect x="800" y="405" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="800" y="405" width="340" height="5" rx="2.5" fill="#7A5F8E"/><text x="970.0" y="444.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="970.0" y="444.0">方案比较</tspan></text><text x="970.0" y="487.4" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="970.0" y="487.4">B0 与候选方案</tspan><tspan x="970.0" y="510.4">成本 · 合规 · 约束状态</tspan><tspan x="970.0" y="533.4">目标比例 · 边界 · 切换点</tspan></text><rect x="430" y="405" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="430" y="405" width="340" height="5" rx="2.5" fill="#B47B32"/><text x="600.0" y="444.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="600.0" y="444.0">条件式建议</tspan></text><text x="600.0" y="487.4" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="600.0" y="487.4">成本优先 · 达标优先</tspan><tspan x="600.0" y="510.4">达到 GHGI 参考线</tspan><tspan x="600.0" y="533.4">最大合规改善</tspan></text><rect x="60" y="405" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="60" y="405" width="340" height="5" rx="2.5" fill="#347C7B"/><text x="230.0" y="444.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="230.0" y="444.0">结果交付</tspan></text><text x="230.0" y="487.4" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="230.0" y="487.4">决策工作台 · 依据</tspan><tspan x="230.0" y="510.4">CSV / PDF</tspan><tspan x="230.0" y="533.4">同一份成功计算结果</tspan></text><path d="M 400 220 L 430 220" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 770 220 L 800 220" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 970 305 L 970 405" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 800 490 L 770 490" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 430 490 L 400 490" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="60" y="635" width="1080" height="90" rx="8" fill="#FBFCFC" stroke="#D4DADF"/><text x="82" y="665" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2933"><tspan x="82" y="665">所有结果共享同一边界</tspan></text><rect x="82" y="684" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="82" y="684" width="5" height="48" rx="2.5" fill="#3E6F98"/><text x="244.0" y="708.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2933"><tspan x="244.0" y="708.0">航次级法规口径估算</tspan></text><rect x="416" y="684" width="334" height="48" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="416" y="684" width="5" height="48" rx="2.5" fill="#B47B32"/><text x="585.0" y="708.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2933"><tspan x="585.0" y="708.0">FuelEU 指示性金额仅用于参考比较</tspan></text><rect x="764" y="684" width="356" height="48" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="764" y="684" width="5" height="48" rx="2.5" fill="#B05B5B"/><text x="944.0" y="708.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2933"><tspan x="944.0" y="708.0">认证、船舶兼容性、供应和交付待确认</tspan></text>
</svg>
