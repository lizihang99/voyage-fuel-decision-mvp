<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="722" viewBox="0 0 1000 722" role="img" aria-labelledby="title description">
<title id="title">用户路径</title>
<desc id="description">自行填写或加载合成示例，查看计算结果、比较方案并复核导出；修改输入后重新计算。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#84919B"/>
  </marker>
</defs>
<rect width="1000" height="722" fill="#F4F6F7"/>
<text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2933"><tspan x="40" y="48">一次航次决策：用户路径</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="40" y="84">从自己的条件或合成示例开始，两种入口共用计算与导出流程。</tspan></text><g data-card="自行填写"><rect x="40" y="125" width="430" height="155" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="125" width="430" height="5" rx="2" fill="#3E6F98"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="255.0" y="164">自行填写</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="255.0" y="202">确认航段，填写基准燃料与用量</tspan><tspan x="255.0" y="229">按需添加候选报价、供应与预算</tspan><tspan x="255.0" y="256">点击计算；没有候选也可只算基准</tspan></text></g><g data-card="试用示例（合成）"><rect x="530" y="125" width="430" height="155" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="530" y="125" width="430" height="5" rx="2" fill="#347C7B"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="745.0" y="164">试用示例（合成）</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="745.0" y="202">基础计算 / 多燃料比较</tspan><tspan x="745.0" y="229">自动填入示例条件并计算</tspan><tspan x="745.0" y="256">不代表真实报价、供应或认证</tspan></text></g><path data-connector="flow" d="M 255 280 V 315 H 180 V 365" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 745 280 V 315 H 180" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="查看计算结果"><rect x="40" y="365" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="365" width="280" height="5" rx="2" fill="#4E7B63"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="180.0" y="404">查看计算结果</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="180.0" y="442">模型成本 · 排放强度</tspan><tspan x="180.0" y="469">合规盈余或缺口</tspan><tspan x="180.0" y="496">示例解释与结果相邻</tspan></text></g><g data-card="按目标比较方案"><rect x="360" y="365" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="360" y="365" width="280" height="5" rx="2" fill="#956524"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="500.0" y="404">按目标比较方案</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="500.0" y="442">成本 / 参考线 / 合规改善</tspan><tspan x="500.0" y="469">查看推荐，也可手动看方案</tspan><tspan x="500.0" y="496">仅有基准时查看基准结果</tspan></text></g><g data-card="复核与导出"><rect x="680" y="365" width="280" height="160" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="680" y="365" width="280" height="5" rx="2" fill="#7A5F8E"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="820.0" y="404">复核与导出</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="820.0" y="442">检查来源、警告与限制</tspan><tspan x="820.0" y="469">导出 CSV / PDF</tspan><tspan x="820.0" y="496">执行条件仍需人工确认</tspan></text></g><path data-connector="flow" d="M 320 445 H 360" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 640 445 H 680" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="support" d="M 500 525 V 580 H 20 V 203 H 40" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#956524"><tspan x="275" y="570">修改输入后，旧结果与导出入口失效</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#52616C"><tspan x="500" y="632">示例可关闭“显示指引”；修改示例输入后撤下专属解释，需重新计算。</tspan></text><path d="M 40 659 H 960" stroke="#D4DADF"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#52616C"><tspan x="500" y="693">切换查看方案不改变输入；修改输入才需要重新计算。</tspan></text>
</svg>
