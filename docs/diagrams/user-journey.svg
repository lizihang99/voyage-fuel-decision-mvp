<rect width="1200" height="790" fill="#F4F6F7"/>
<text x="56" y="50" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2933"><tspan x="56" y="50">一次航次决策：用户路径</tspan></text><text x="56" y="84" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="56" y="84">六个步骤形成闭环，条件变化后可以随时回到候选方案重新计算</tspan></text><rect x="60" y="130" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="60" y="130" width="340" height="5" rx="2.5" fill="#3E6F98"/><circle cx="94" cy="168" r="17" fill="#3E6F98"/><text x="94" y="168.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="94" y="168.0">1</tspan></text><text x="124" y="168" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="124" y="168">建立航次案例</tspan></text><text x="230.0" y="203.5" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="230.0" y="203.5">报告年份 · 两个相邻有效港口</tspan><tspan x="230.0" y="226.5">基准燃料 · 用量 · 价格</tspan></text><rect x="430" y="130" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="430" y="130" width="340" height="5" rx="2.5" fill="#3E6F98"/><circle cx="464" cy="168" r="17" fill="#3E6F98"/><text x="464" y="168.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="464" y="168.0">2</tspan></text><text x="494" y="168" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="494" y="168">添加候选与约束</tspan></text><text x="600.0" y="203.5" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="600.0" y="203.5">候选燃料 · 报价</tspan><tspan x="600.0" y="226.5">比例 · 供应量 · 预算</tspan></text><rect x="800" y="130" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="800" y="130" width="340" height="5" rx="2.5" fill="#4E7B63"/><circle cx="834" cy="168" r="17" fill="#4E7B63"/><text x="834" y="168.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="834" y="168.0">3</tspan></text><text x="864" y="168" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="864" y="168">运行计算</tspan></text><text x="970.0" y="203.5" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="970.0" y="203.5">B0 与候选方案</tspan><tspan x="970.0" y="226.5">使用同一能源口径</tspan></text><rect x="800" y="410" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="800" y="410" width="340" height="5" rx="2.5" fill="#B47B32"/><circle cx="834" cy="448" r="17" fill="#B47B32"/><text x="834" y="448.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="834" y="448.0">4</tspan></text><text x="864" y="448" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="864" y="448">选择决策目标</tspan></text><text x="970.0" y="472.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="970.0" y="472.0">成本优先</tspan><tspan x="970.0" y="495.0">达到 GHGI 参考线</tspan><tspan x="970.0" y="518.0">最大合规改善</tspan></text><rect x="430" y="410" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="430" y="410" width="340" height="5" rx="2.5" fill="#7A5F8E"/><circle cx="464" cy="448" r="17" fill="#7A5F8E"/><text x="464" y="448.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="464" y="448.0">5</tspan></text><text x="494" y="448" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="494" y="448">查看比较与边界</tspan></text><text x="600.0" y="483.5" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="600.0" y="483.5">方案差异 · 排名</tspan><tspan x="600.0" y="506.5">临界点 · 执行状态</tspan></text><rect x="60" y="410" width="340" height="170" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="60" y="410" width="340" height="5" rx="2.5" fill="#347C7B"/><circle cx="94" cy="448" r="17" fill="#347C7B"/><text x="94" y="448.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF"><tspan x="94" y="448.0">6</tspan></text><text x="124" y="448" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="124" y="448">复核与导出</tspan></text><text x="230.0" y="483.5" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="230.0" y="483.5">检查依据和限制</tspan><tspan x="230.0" y="506.5">导出 CSV / PDF</tspan></text><path d="M 400 215 L 430 215" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 770 215 L 800 215" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 970 300 L 970 410" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 800 495 L 770 495" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 430 495 L 400 495" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 230 580 L 230 650 L 600 650 L 600 300" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="620" y="640" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="15" font-weight="600" fill="#B47B32"><tspan x="620" y="640">调整条件后重新计算</tspan></text><rect x="60" y="690" width="1080" height="65" rx="8" fill="#FBFCFC" stroke="#D4DADF"/><text x="600" y="723.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="600" fill="#1F2933"><tspan x="600" y="723.0">每个结果都保留：航次级估算 · 执行条件待确认 · 依据可追溯</tspan></text>
</svg>
