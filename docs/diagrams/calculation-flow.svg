" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933"><tspan x="110" y="390.0">统一口径</tspan></text><rect x="220" y="350" width="940" height="80" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="220" y="350" width="940" height="5" rx="2.5" fill="#4E7B63"/><text x="690.0" y="389.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="690.0" y="389.0">统一计算口径</tspan></text><text x="690.0" y="422.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="690.0" y="422.0">同一年份、同一航段、同一能源需求、同一币种</tspan></text><rect x="40" y="480" width="1120" height="170" rx="8" fill="#F6F7F8"/><text x="110" y="565.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933"><tspan x="110" y="565.0">逐方案计算</tspan></text><rect x="220" y="505" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="220" y="505" width="280" height="5" rx="2.5" fill="#3E6F98"/><text x="360.0" y="544.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="360.0" y="544.0">准备比较的方案</tspan></text><text x="360.0" y="567.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="360.0" y="567.9">基准方案 · 用户指定比例</tspan><tspan x="360.0" y="590.9">关键比例和限制边界</tspan></text><rect x="530" y="505" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="530" y="505" width="280" height="5" rx="2.5" fill="#4E7B63"/><text x="670.0" y="544.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="670.0" y="544.0">逐个方案计算</tspan></text><text x="670.0" y="567.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="670.0" y="567.9">能源 · 燃料用量 · 排放</tspan><tspan x="670.0" y="590.9">EU ETS · FuelEU · 成本</tspan></text><rect x="840" y="505" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="840" y="505" width="280" height="5" rx="2.5" fill="#347C7B"/><text x="980.0" y="544.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="980.0" y="544.0">每个方案的结果</tspan></text><text x="980.0" y="567.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="980.0" y="567.9">用量、成本、排放和合规结果</tspan><tspan x="980.0" y="590.9">计算保留完整精度</tspan></text><path d="M 500 565 L 530 565" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 810 565 L 840 565" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="680" width="1120" height="170" rx="8" fill="#F8F5EF"/><text x="110" y="765.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933"><tspan x="110" y="765.0">比较与提示</tspan></text><rect x="840" y="705" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="840" y="705" width="280" height="5" rx="2.5" fill="#7A5F8E"/><text x="980.0" y="744.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="980.0" y="744.0">方案放在一起比较</tspan></text><text x="980.0" y="767.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="980.0" y="767.9">相对基准方案的变化</tspan><tspan x="980.0" y="790.9">更低成本 · 更大改善</tspan></text><rect x="530" y="705" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="530" y="705" width="280" height="5" rx="2.5" fill="#B47B32"/><text x="670.0" y="744.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="670.0" y="744.0">价格临界点</tspan></text><text x="670.0" y="767.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="670.0" y="767.9">燃料或 EUA 价格</tspan><tspan x="670.0" y="790.9">改变方案判断的临界值</tspan></text><rect x="220" y="705" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="220" y="705" width="280" height="5" rx="2.5" fill="#B47B32"/><text x="360.0" y="744.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="360.0" y="744.0">目标下的结果提示</tspan></text><text x="360.0" y="767.9" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="360.0" y="767.9">成本优先 · 达标优先</tspan><tspan x="360.0" y="790.9">合规改善优先</tspan></text><path d="M 840 765 L 810 765" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 530 765 L 500 765" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="40" y="880" width="1120" height="170" rx="8" fill="#F1F4F8"/><text x="110" y="965.0" text-anchor="middle" fo