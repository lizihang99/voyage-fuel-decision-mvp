<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="930" viewBox="0 0 1000 930" role="img" aria-labelledby="title description">
<title id="title">计算流程与支撑关系</title>
<desc id="description">输入、逐方案计算、比较与建议、展示与导出构成主线；规则与数据从侧面支撑计算，不表示具体代码调用顺序。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#84919B"/>
  </marker>
</defs>
<rect width="1000" height="930" fill="#F4F6F7"/>
<text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2933"><tspan x="40" y="48">计算流程与支撑关系</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="40" y="84">主线看结果如何形成；右侧看计算依赖的规则与数据。</tspan></text><g data-card="1  输入与统一口径"><rect x="40" y="125" width="620" height="130" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="125" width="620" height="5" rx="2" fill="#3E6F98"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="350.0" y="164">1  输入与统一口径</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="350.0" y="202">同一年份、同一航段、同一能源需求</tspan><tspan x="350.0" y="229">基准燃料 · 候选报价 · 供应 / 预算 / 比例限制</tspan></text></g><g data-card="2  逐方案计算"><rect x="40" y="300" width="620" height="185" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="300" width="620" height="5" rx="2" fill="#4E7B63"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="350.0" y="339">2  逐方案计算</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="350.0" y="377">各候选分别计算，不把多个候选同时混兑</tspan><tspan x="350.0" y="404">计算燃料用量、排放与合规结果</tspan><tspan x="350.0" y="431">模型成本 = 燃料成本 + EU ETS 配额成本</tspan><tspan x="350.0" y="458">FuelEU 指示性金额以欧元单列，不计入模型成本或预算</tspan></text></g><g data-card="3  比较与条件式建议"><rect x="40" y="530" width="620" height="130" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="530" width="620" height="5" rx="2" fill="#956524"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="350.0" y="569">3  比较与条件式建议</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="350.0" y="607">按成本、GHGI 参考线和合规改善目标比较</tspan><tspan x="350.0" y="634">同时分析供应限制、所需混兑比例及价格变化的影响</tspan></text></g><g data-card="4  展示与导出"><rect x="40" y="705" width="620" height="130" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="40" y="705" width="620" height="5" rx="2" fill="#347C7B"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="350.0" y="744">4  展示与导出</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="350.0" y="782">工作台与 CSV / PDF 使用同一次计算结果</tspan><tspan x="350.0" y="809">保留数据来源、规则版本和问题说明</tspan></text></g><path data-connector="flow" d="M 350 255 V 300" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 350 485 V 530" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path data-connector="flow" d="M 350 660 V 705" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><g data-card="规则与数据支撑"><rect x="720" y="300" width="240" height="185" rx="8" fill="#FFFFFF" stroke="#D4DADF"/><rect x="720" y="300" width="240" height="5" rx="2" fill="#7A5F8E"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="700" fill="#1F2933"><tspan x="840.0" y="339">规则与数据支撑</tspan></text><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="840.0" y="377">港口身份与适用比例</tspan><tspan x="840.0" y="404">燃料热值与排放参数</tspan><tspan x="840.0" y="431">燃料资格与来源版本</tspan><tspan x="840.0" y="458">法规来源与核对记录</tspan></text></g><path data-connector="support" d="M 720 392 H 660" fill="none" stroke="#84919B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#3E6F98"><tspan x="720" y="157">共同前提</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="720" y="194">输入价格和预算</tspan><tspan x="720" y="221">使用同一币种；</tspan><tspan x="720" y="248">系统不自动换汇。</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#956524"><tspan x="720" y="566">怎样理解比较？</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="720" y="603">成本最低、达到参考线、</tspan><tspan x="720" y="630">改善最大，可能对应</tspan><tspan x="720" y="657">不同方案。</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#347C7B"><tspan x="720" y="741">说明与引导</tspan></text><text text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="400" fill="#52616C"><tspan x="720" y="778">示例指引解释已有结果，</tspan><tspan x="720" y="805">不另设计算链路。</tspan></text><path d="M 40 865 H 960" stroke="#D4DADF"/><text text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#52616C"><tspan x="500" y="899">实线：结果形成主线 · 虚线：规则与数据支撑 · 所有结果均为航次级估算</tspan></text>
</svg>
