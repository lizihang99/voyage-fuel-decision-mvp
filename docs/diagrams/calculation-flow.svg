<rect width="1200" height="1180" fill="#F4F6F7"/>
<text x="56" y="50" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2933"><tspan x="56" y="50">计算流程与支撑关系</tspan></text><text x="56" y="84" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="56" y="84">先统一计算基础，再逐个计算方案，最后比较、提示并形成可追溯结果</tspan></text><rect x="40" y="130" width="1120" height="170" rx="8" fill="#EEF3F6"/><text x="110" y="215.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="18" font-weight="700" fill="#1F2933"><tspan x="110" y="215.0">输入与基础</tspan></text><rect x="220" y="150" width="220" height="130" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="220" y="150" width="220" height="5" rx="2.5" fill="#3E6F98"/><text x="330.0" y="189.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="330.0" y="189.0">航次信息</tspan></text><text x="330.0" y="219.1" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="330.0" y="219.1">年份 · 港口 · 基准燃料</tspan><tspan x="330.0" y="242.1">候选 · 价格 · 限制条件</tspan></text><rect x="460" y="150" width="220" height="130" rx="8" fill="#FFFFFF" stroke="#D4DADF" filter="url(#card-shadow)"/><rect x="460" y="150" width="220" height="5" rx="2.5" fill="#4E7B63"/><text x="570.0" y="189.0" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2933"><tspan x="570.0" y="189.0">适用范围</tspan></text><text x="570.0" y="219.1" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#66717C"><tspan x="570.0" y="219.1">判断航段适用的规则</tspan><tspan x="570.0" y="242.1">EU ETS / FuelEU 比例<