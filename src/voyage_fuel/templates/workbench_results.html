<section id="workbench-root" class="workspace workbench-results" data-workbench-view hidden>
  <div class="section-heading">
    <div><p class="eyebrow">决策工作台</p><h2>方案比较与投入产出</h2></div>
    <div class="result-heading-status">
      <label class="teaching-guide-toggle"><input id="teaching-guide-toggle" type="checkbox" checked disabled> 显示指引</label>
      <span id="example-result-status" class="status-chip synthetic-status" hidden></span><span id="workbench-status" class="status-chip muted">尚未计算</span>
    </div>
  </div>
  <div id="teaching-guide-intro" class="teaching-guide-intro" role="note" hidden></div>
  <div id="workbench-boundary" class="boundary-summary" role="status">
    完成计算后，这里会显示目标、方案、成本变化和 FuelEU 参考线。
  </div>
  <div id="workbench-content">
    <div class="workbench-empty">
      <strong>先建立航次现状</strong>
      <p>填写航次和基准燃料；有候选燃料时，系统会在同一能源需求下比较。</p>
    </div>
    <div id="workbench-goal-cards" hidden></div>
    <div id="workbench-scenario-table" hidden></div>
    <div id="workbench-selected-detail" hidden></div>
    <div id="workbench-sensitivity" hidden></div>
    <div id="workbench-evidence" hidden></div>
  </div>
</section>
